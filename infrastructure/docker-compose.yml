services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: datalake-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # Cổng S3 API: Chỉ chấp nhận kết nối nội bộ
      - "127.0.0.1:9001:9001"   # Cổng Console: Bảo vệ nội bộ, chống quét mạng Internet
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Set the public HTTPS Console URL on VPS; local default stays local.
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    volumes:
      - ../data/minio_storage:/data
    command: server /data --console-address ":9001"
